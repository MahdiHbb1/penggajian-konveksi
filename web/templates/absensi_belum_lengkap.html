      <thead>

      </thead>
      <tbody>
        <tr><td class="kosong" colspan="5">Tidak ada absensi yang belum lengkap.</td></tr>
      </tbody>
    </table>
  </div>
</section>

<p class="owner">Pemilik: Zahra | Modul 3</p>
