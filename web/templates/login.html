{{define "konten"}}
<!-- Pemilik: Fadli | Modul 6 -->
<section class="auth-card">
  <h1>Masuk</h1>
  <p>Sistem Penggajian Konveksi Mitra Jaya</p>
  {{if .Galat}}<div class="alert alert-error" role="alert">{{.Galat}}</div>{{end}}
  {{if .Info}}<div class="alert alert-info" role="status">{{.Info}}</div>{{end}}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <label>Username
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="btn" type="submit">Masuk</button>
  </form>
  <p class="owner">Pemilik: Fadli | Modul 6</p>
</section>
{{end}}
